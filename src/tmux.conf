# Place in ~/.config/tmux/tmux.conf (on the servers it is a symlink to this file)

set -g mouse on

# Agent-friendly basics
set -sg escape-time 10          # default 500 ms delays Esc (interrupting Claude Code/Codex, vim)
set -g history-limit 100000     # agents print a lot; default scrollback is 2000 lines
set -g focus-events on
set -g set-clipboard on         # copy-mode yanks reach the Mac clipboard via OSC 52 (WezTerm supports it)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -s extended-keys on         # lets Shift+Enter etc. through to TUI apps
set -g renumber-windows on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# create new panes in the current directory without the prefix.
# Was C-w / C-e: those stole Ctrl-W (delete word) and Ctrl-E (end of line) from the shell,
# Claude Code's prompt, and vim's window commands.
bind -n M-w split-window -h -c "#{pane_current_path}"
bind -n M-e split-window -v -c "#{pane_current_path}"

# open pane in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
